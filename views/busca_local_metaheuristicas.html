<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   

    <form id="searchForm">
        <div>
            <label for="initial_solution">Tamanho do problema:</label>
            <input type="number" id="initial_solution" name="initial_solution" min="1" max="30" value="20">
        </div>
    <div class="metodos">
        <h2>O método que deseja utilizar</h2>
        <select name="methodSelect" id="methodSelect">
            <option value="SubidaEncosta">Subida de Encosta</option>
            <option value="SubidaEncostaLimite">Subida de Encosta com Tentativas</option>
            <option value="TemperaSimulada">Têmpera Simulada</option>
            <option value="AlgoritimoGenetico">Algoritmo Genético</option>
        </select>
        <div id="genetic_parameters" style="display:none;">
            <label for="TP">Tamanho da População:</label>
            <input type="number" id="TP" name="TP" min="10" max="1000" value="30">
            <br>

            <label for="NG">Número de Gerações:</label>
            <input type="number" id="NG" name="NG" min="10" max="10000" value="300">
            <br>

            <label for="TC">Taxa de Cruzamento (0–1):</label>
            <input type="number" id="TC" name="TC" step="0.01" min="0.5" max="1.0" value="0.9">
            <br>

            <label for="TM">Taxa de Mutação (0–1):</label>
            <input type="number" id="TM" name="TM" step="0.01" min="0.01" max="0.3" value="0.1">
            <br>

            <label for="IG">Intervalo de Geração / Elitismo (0–1):</label>
            <input type="number" id="IG" name="IG" step="0.01" min="0.0" max="0.5" value="0.2">
            <br>
        </div>
        <div id ="limite" style="display:none;">
            <label id="labelNumber" for="number"></label>
            <input id="number" name = "limite"  type="number"> </input>

        </div>
        <div id="tempera" style="display:none;">
    <label for="initial_temp">Temperatura Inicial:</label>
<input 
    type="number" 
    id="initial_temp" 
    name="initial_temp" 
    step="any"
    min="0.1"
    value="100.0">
<br>

<label for="final_temp">Temperatura Final:</label>
<input 
    type="number" 
    id="final_temp" 
    name="final_temp" 
    step="any"
    min="0.0001" 
    value="1.0">
<br>

<label for="cooling_rate">Taxa de Resfriamento (0–1):</label>
<input 
    type="number" 
    id="cooling_rate" 
    name="cooling_rate" 
    step="0.001"
    min="0.80" 
    max="0.999" 
    value="0.950">
<br>
            <br>
    </div>
    <div>
        <h2>Parâmetros do Algoritmo</h2>
        <div id="parameters"></div>
        <button type="submit" id="startButton">Iniciar Busca</button>
        <button type="button" id="resetButton">Gerar Relatório</button>
    </div>
        </form>
    <div class="resultado">
        <h2>Resultado da Busca</h2>
        <p id="caminho"></p>
        <div id="resultContainer"></div>
    </div>
    <div class="relatorio">
        <h2>Relatório de Ganhos Percentuais Médios</h2>
        <div id="relatorioContainer">
            <table id="relatorioTable" border="1">
                
            </table>
    </div>
    <button onclick="gerarPDF()">Obter PDF</button>
    </div> 
    

</body>
<script src="/static/grafo_bl_cliente.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

</html>
